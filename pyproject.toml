[project]
name = "opstracking"
version = "0.1.0"
description = "OpsTracking — operations tracking platform (Django + DRF + Channels + Celery)"
requires-python = ">=3.12"

# ─────────────────────────── pytest ───────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "opstracking.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: tests that hit the network or take more than a second",
    "realtime: tests that exercise Channels consumers",
]

# ──────────────────────────── ruff ────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "*/migrations/*",
    ".venv",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "DJ",   # flake8-django
    "C4",   # comprehensions
    "T20",  # no print()
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default arg — common and fine in DRF
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]      # scripts are allowed to print
"tests/*" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use core.timezone.now_ist() — see architecture doc H-6."
"datetime.datetime.utcnow".msg = "Use core.timezone.now_ist() — see architecture doc H-6."

# ─────────────────────────── coverage ───────────────────────────
[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    # Scaffolded, not installed (INSTALLED_APPS, urls, FEATURE_CHAT all skip
    # it) — see apps/chat/README.md. Testing dead code adds nothing.
    "apps/chat/*",
    # Process entrypoints: wiring, not logic. Exercised by actually running
    # the process (see scripts/load_test/), not by unit tests.
    "manage.py",
    "opstracking/asgi.py",
    "opstracking/wsgi.py",
    "opstracking/celery.py",
    # One-time cutover utility against the legacy Flask table — needs the
    # real legacy bcrypt column to mean anything.
    "scripts/migrate_password_hashes.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "pragma: no cover",
]
