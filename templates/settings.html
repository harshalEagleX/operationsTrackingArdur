<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - OpsTracking</title>
    <link rel="stylesheet" href="{{ static('styles/settings.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="{{ static('icons/ardurtech.png') }}" alt="Ardur Technologies" class="logo">
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url('pages:dashboard') }}" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <button class="nav-item active" data-section="sessions">
                    <i class="fas fa-users"></i>
                    <span>Active Sessions</span>
                </button>
                <button class="nav-item" data-section="users">
                    <i class="fas fa-user-shield"></i>
                    <span>Manage Users</span>
                </button>
                <button class="nav-item" data-section="system">
                    <i class="fas fa-cog"></i>
                    <span>System</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="content-header">
                <div class="header-left">
                    <h2 id="pageTitle"><i class="fas fa-cog"></i> Settings</h2>
                </div>
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                    <span>{{ username }}</span>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Active Sessions Section -->
                <div id="sessions" class="content-section active">
                    <div class="section-header">
                        <div class="header-info">
                            <h2>Active Sessions</h2>
                            <p>View and manage active user sessions</p>
                        </div>
                        <div class="session-filters">
                            <input type="text" id="sessionSearch" placeholder="Search Employee...">
                            <button class="btn-secondary" id="refreshSessions">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>
                    <div class="sessions-list">
                        <!-- Sessions will be populated dynamically -->
                    </div>
                </div>

                <!-- Manage Users Section -->
                <div id="users" class="content-section">
                    <div class="section-header">
                        <div class="header-info">
                            <h2>Manage Users</h2>
                            <p>View and manage all user accounts</p>
                        </div>
                        <div class="session-filters">
                            <input type="text" id="userSearch" placeholder="Search Employee...">
                            <button class="btn-secondary" id="refreshUsers">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>
                    <div class="users-list">
                        <!-- Users will be populated dynamically -->
                    </div>
                </div>

                <!-- System Settings Section -->
                <div id="system" class="content-section">
                    <div class="section-header">
                        <div class="header-info">
                            <h2>System Settings</h2>
                            <p>Manage system configuration and maintenance</p>
                        </div>
                    </div>
                    <div class="system-actions">
                        <button class="btn-secondary" id="clearCacheBtn">
                            <i class="fas fa-broom"></i>
                            Clear Cache
                        </button>
                        <button class="btn-secondary" id="exportDataBtn">
                            <i class="fas fa-download"></i>
                            Export Data
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>


    <!-- Reset Session Modal -->
    <div id="resetSessionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Reset Session</h2>
                <button class="close-btn" onclick="$('#resetSessionModal').fadeOut(300)" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-message"></div>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="$('#resetSessionModal').fadeOut(300)">
                        Cancel
                    </button>
                    <button class="btn-danger" id="confirmResetBtn">
                        Reset Session
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div id="resetPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Reset Password</h2>
                <button class="close-btn" onclick="$('#resetPasswordModal').fadeOut(300)" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-message"></div>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="$('#resetPasswordModal').fadeOut(300)">
                        Cancel
                    </button>
                    <button class="btn-danger" id="confirmResetPasswordBtn">
                        Reset Password
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div id="changePasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Change Password</h2>
                <button class="close-btn" onclick="$('#changePasswordModal').fadeOut(300)" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-message" style="margin-bottom: 15px;"></div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="newPasswordInput">New Password</label>
                    <input type="text" id="newPasswordInput" class="form-control" placeholder="Enter new password">
                </div>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="$('#changePasswordModal').fadeOut(300)">
                        Cancel
                    </button>
                    <button class="btn-primary" id="confirmChangePasswordBtn">
                        Change Password
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage"></span>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="{{ static('js/admin/settings.js') }}"></script>
</body>
</html>
