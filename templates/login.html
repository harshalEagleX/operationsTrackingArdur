<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · OpsTracking</title>
    <link rel="stylesheet" href="{{ static('styles/signup.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Company Logo -->
        <img src="{{ static('icons/ardurtech.png') }}" alt="Ardur Technologies" id="companyLogo">

        <form id="login-form" action="{{ url('pages:login') }}" method="post">
            {{ csrf_input }}

            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}

            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="emp_id" name="emp_id" required placeholder="Employee ID" oninput="this.value = this.value.toUpperCase()">
            </div>

            <div class="input-group has-toggle">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" required placeholder="Password">
                <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <button type="submit">
                <i class="fas fa-sign-in-alt"></i>
                Login
            </button>
        </form>
        <p>Don't have an account? <a href="{{ url('pages:signup') }}">Sign up</a></p>
    </div>

    <script src="{{ static('js/login.js') }}"></script>
</body>
</html>
