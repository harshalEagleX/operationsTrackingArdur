<!-- All Modals and Popups Component -->

<!-- Logout Confirmation Popup -->
<div id="logout-popup" class="popup hidden">
    <div class="popup-content">
        <h2 style="margin-bottom: 20px; font-size: 17px; text-align: center; color: #333;">Are you sure you want to logout?</h2>
        <div>
            <button id="confirm-logout" class="popup-btn">Yes</button>
            <button id="cancel-logout" class="popup-btn">No</button>
        </div>
    </div>
</div>

<!-- Reset Password Popup -->
<div id="reset-popup" class="reset-popup hidden">
    <div class="reset-content">
        <div class="reset-header">
            <h3><i class="fas fa-key"></i> Reset Password</h3>
            <button class="close-reset"><i class="fas fa-times"></i></button>
        </div>
        <form id="reset-form" class="reset-body">
            <div class="form-group">
                <label for="old-password"><i class="fas fa-lock"></i> Old Password</label>
                <div class="password-field">
                    <input type="password" id="old-password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="new-password"><i class="fas fa-lock"></i> New Password</label>
                <div class="password-field">
                    <input type="password" id="new-password" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm-password"><i class="fas fa-lock"></i> Confirm Password</label>
                <div class="password-field">
                    <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="reset-actions">
                <button type="submit" class="btn-primary" id="reset-submit"><i class="fas fa-save"></i> Update</button>
                <button type="button" class="btn-secondary" id="reset-cancel"><i class="fas fa-times"></i> Cancel</button>
            </div>
        </form>
    </div>
</div>

                    <div class="form-group">

                    </div>

    </div>
</div>

<!-- Edit Feedback Modal -->
<div id="auditEditModal" class="auditmodal">
    <div class="auditmodal-content audit-edit-modal">
        <span class="auditclose-btn">&times;</span>
        <h2><i class="fas fa-edit"></i> Edit Feedback</h2>
        <form id="editFeedbackForm" class="audit-edit-content">
            <div class="detail-grid">
                <input type="hidden" id="editFeedbackId">
                <div class="detail-item">
                    <label for="editOrderBatchId">Order/Batch ID:</label>
                    <input type="text" id="editOrderBatchId" name="order_batch_id" required readonly>
                </div>
                <div class="detail-item">
                    <label for="editFeedbackRecorded">Feedback Recorded:</label>
                    <select id="editFeedbackRecorded" name="feedback_recorded" required>
                        <option value="internalAudit">Internal Audit</option>
                        <option value="external">External</option>
                    </select>
                </div>
                <div class="detail-item">
                    <label for="editEmpId">Employee ID:</label>
                    <input type="text" id="editEmpId" name="emp_id" required readonly>
                </div>
                <div class="detail-item">
                    <label for="editEmpName">Employee Name:</label>
                    <input type="text" id="editEmpName" name="emp_name" required readonly>
                </div>
                <div class="detail-item">
                    <label for="editProject">Project:</label>
                    <input type="text" id="editProject" name="project" required readonly>
                </div>
                <div class="detail-item">
                    <label for="editClientCode">Client Code:</label>
                    <input type="text" id="editClientCode" name="client_code" required readonly>
                </div>
                <div class="detail-item">
                    <label for="editWorkType">Work Type:</label>
                    <input type="text" id="editWorkType" name="work_type" readonly>
                </div>
                <div class="detail-item">
                    <label for="editProcessedDate">Processed Date:</label>
                    <input type="date" id="editProcessedDate" name="processed_date" required>
                </div>
                <div class="detail-item">
                    <label for="editFeedbackReceivedDate">Feedback Received Date:</label>
                    <input type="date" id="editFeedbackReceivedDate" name="feedback_received_date" required>
                </div>
                <div class="detail-item">
                    <label for="editFeedbackReceivedMode">Feedback Mode:</label>
                    <select id="editFeedbackReceivedMode" name="feedback_received_mode" required>
                        <option value="email">Email</option>
                        <option value="chat">Chat</option>
                        <option value="verbal">Verbal</option>
                        <option value="others">Others</option>
                    </select>
                </div>
                <div class="detail-item">
                    <label for="editFeedbackProvidedBy">Provided By:</label>
                    <input type="text" id="editFeedbackProvidedBy" name="feedback_provided_by" required>
                </div>
                <div class="detail-item">
                    <label for="editFeedback">Feedback:</label>
                    <textarea id="editFeedback" name="feedback" required></textarea>
                </div>
                <div class="detail-item">
                    <label for="editSeverity">Severity:</label>
                    <select id="editSeverity" name="severity" required>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                        <option value="null">Null</option>
                    </select>
                </div>
                <div class="detail-item">
                    <label for="editType">Type:</label>
                    <select id="editType" name="type" required>
                        <option value="typoErrors">Typo Errors</option>
                        <option value="missedToKey">Missed To Key</option>
                        <option value="instructionsNotFollowed">Instructions Not Followed</option>
                        <option value="misinterpretation">Misinterpretation</option>
                        <option value="softwareIssue">Software Issue</option>
                        <option value="wrongFeedback">Wrong Feedback</option>
                        <option value="newFeedback">New Feedback</option>
                        <option value="duplicateFeedback">Duplicate Feedback</option>
                        <option value="repeatMistake">Repeat Mistake</option>
                        <option value="errorpriortosopupdate">Error Prior to SOP Update</option>
                    </select>
                </div>
                <div class="detail-item">
                    <label for="editComments">Comments:</label>
                    <textarea id="editComments" name="comments"></textarea>
                </div>
                <div class="detail-item">
                    <label for="editActionTaken">Action Taken:</label>
                    <textarea id="editActionTaken" name="action_taken"></textarea>
                </div>
                <div class="detail-item">
                    <label for="editStatus">Status:</label>
                    <select id="editStatus" name="status" required>
                        <option value="open">Open</option>
                        <option value="close">Close</option>
                    </select>
                </div>
                <div class="detail-item">
                    <label for="editAcknowledgment">Acknowledgment:</label>
                    <select id="editAcknowledgment" name="acknowledgment">
                        <option value="">Pending</option>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>
                <div class="detail-item">
                    <label for="editAcknowledgmentComment">Acknowledgment Comment:</label>
                    <textarea id="editAcknowledgmentComment" name="acknowledgment_comment"></textarea>
                </div>
                <div class="detail-item full-width">
                    <label for="editImages">Screenshots:</label>
                    <input type="file" id="editImages" name="images" multiple accept="image/*">
                    <div id="existingImages" class="image-gallery"></div>
                </div>
            </div>
            <div class="audit-form-actions">
                <button type="submit" class="audit-save-btn">Save Changes</button>
                <button type="button" class="audit-cancel-btn">Cancel</button>
            </div>
        </form>
    </div>
</div>
