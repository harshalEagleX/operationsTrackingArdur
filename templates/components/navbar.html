<!-- Header Component -->
<header class="header">
    <button id="toggle-nav" class="toggle-nav-btn">&#9776;</button>
    <h3><i class="fas fa-chalkboard-teacher"></i> OpsTracking</h3>
    <div class="user-info">
        <span id="user-name" class="user-name-btn" data-employee-id="{{ current_user.emp_id }}" title="Reset Password">
            <i class="fas fa-user-circle"></i> 
            {{ current_user.name }}
            <i class="fas fa-key reset-indicator"></i>
        </span>
        <div id="user-menu" class="user-menu hidden">
            <ul>
                <li><a href="#" id="open-reset-link"><i class="fas fa-key"></i> Reset Password</a></li>
            </ul>
        </div>
        <form method="post" action="{{ url('api:accounts:logout') }}" id="logout-form" style="display:inline; margin:0; padding:0;">
            {{ csrf_input }}
            <button type="submit" id="logout-btn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </form>
    </div>
</header>
