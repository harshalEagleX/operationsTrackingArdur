<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ static('styles/signup.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Karla', sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .setup-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        .setup-container h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group input:disabled, .form-group select:disabled {
            background: #e9ecef;
            cursor: not-allowed;
            color: #6c757d;
        }
        .btn-submit {
            background: #1abc9c;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: #16a085;
        }
        /* Make it full width for single columns if needed */
        .full-width {
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="setup-container">
    <h2>Complete Your Profile</h2>
    <p style="text-align: center; color: #666; margin-bottom: 30px; margin-top: -20px;">
        Welcome to OpsTracking! Please complete your missing profile details to access your dashboard.
    </p>

    <form method="POST" action="{{ url('pages:profile_setup') }}">
        {{ csrf_input }}
        
        <div class="form-grid">
            <!-- Pre-filled & Disabled -->
            <div class="form-group">
                <label>Name</label>
                <input type="text" value="{{ employee.name }}" disabled>
            </div>
            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" value="{{ employee.employee_id }}" disabled>
            </div>
            <div class="form-group">
                <label>Role</label>
                <input type="text" value="{{ employee.role }}" disabled>
            </div>
            <div class="form-group">
                <label>Project</label>
                <input type="text" value="{{ employee.project }}" disabled>
            </div>
            <div class="form-group">
                <label>Client Code</label>
                <input type="text" value="{{ employee.client_code }}" disabled>
            </div>
            <div class="form-group">
                <label>Work Type</label>
                <input type="text" value="{{ employee.work_type }}" disabled>
            </div>

            <!-- Mandatory Editable Fields -->
            <div class="form-group">
                <label>Email ID <span style="color:red">*</span></label>
                <input type="email" name="email" value="{{ employee.email }}" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Mobile Number <span style="color:red">*</span></label>
                <input type="text" name="phone" value="{{ employee.phone }}" required placeholder="Enter 10-digit number" pattern="\d{10,15}">
            </div>
            <div class="form-group">
                <label>Alternate Mobile</label>
                <input type="text" name="alternate_phone" value="{{ employee.alternate_phone }}" placeholder="Optional">
            </div>
            <div class="form-group">
                <label>Joining Date <span style="color:red">*</span></label>
                <input type="date" name="date_of_joining" value="{{ employee.date_of_joining|default('', True) }}" required>
            </div>
            <div class="form-group">
                <label>Shift Time <span style="color:red">*</span></label>
                <select name="shift" required>
                    <option value="">Select a shift</option>
                    <option value="Morning Shift" {% if employee.shift == 'Morning Shift' %}selected{% endif %}>Morning Shift (06:00 - 15:00)</option>
                    <option value="General Shift" {% if employee.shift == 'General Shift' %}selected{% endif %}>General Shift (09:00 - 18:00)</option>
                    <option value="Evening Shift" {% if employee.shift == 'Evening Shift' %}selected{% endif %}>Evening Shift (14:00 - 23:00)</option>
                    <option value="Night Shift" {% if employee.shift == 'Night Shift' %}selected{% endif %}>Night Shift (21:00 - 06:00)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Work Location <span style="color:red">*</span></label>
                <select name="department" required>
                    <option value="">Select location</option>
                    <option value="Pune" {% if employee.department == 'Pune' %}selected{% endif %}>Pune</option>
                    <option value="Betul" {% if employee.department == 'Betul' %}selected{% endif %}>Betul</option>
                </select>
            </div>
            <div class="form-group">
                <label>Employee Type <span style="color:red">*</span></label>
                <select name="employee_type" required>
                    <option value="">Select type</option>
                    <option value="employee" {% if employee.employee_type == 'employee' %}selected{% endif %}>Employee</option>
                    <option value="consultant" {% if employee.employee_type == 'consultant' %}selected{% endif %}>Consultant</option>
                    <option value="freelancer" {% if employee.employee_type == 'freelancer' %}selected{% endif %}>Freelancer</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn-submit">Save Profile & Continue</button>
    </form>
    
    <div style="text-align: center; margin-top: 15px;">
        <form id="logout-form" method="post" action="{{ url('api:accounts:logout') }}">
            {{ csrf_input }}
            <button type="submit" style="background: none; border: none; color: #dc3545; cursor: pointer; font-size: 14px; text-decoration: underline;">
                <i class="fas fa-sign-out-alt"></i> Logout instead
            </button>
        </form>
    </div>
</div>

<script>
document.getElementById('logout-form').addEventListener('submit', function(e) {
    e.preventDefault();
    fetch(this.action, {
        method: 'POST',
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        }
    }).then(res => {
        window.location.href = "{{ url('pages:login') }}";
    }).catch(err => {
        console.error('Logout error:', err);
        window.location.href = "{{ url('pages:login') }}";
    });
});
</script>

</body>
</html>
